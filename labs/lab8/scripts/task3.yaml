apiVersion: v1
kind: Namespace
metadata:
  name: exam-scheduling
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reports
  namespace: exam-scheduling
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reports
  template:
    metadata:
      labels:
        app: reports
    spec:
      nodeSelector:
        kubernetes.io/hostname: cka-worker99
      containers:
        - name: reports
          image: nginx:1.29-alpine
