apiVersion: v1
kind: Namespace
metadata:
  name: exam-storage
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: lab8-local
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: Immediate
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: lab8-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: lab8-local
  hostPath:
    path: /tmp/lab8-storage
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-data
  namespace: exam-storage
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: lab8-fast
  resources:
    requests:
      storage: 500Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: storage-api
  namespace: exam-storage
spec:
  containers:
    - name: storage-api
      image: busybox:1.37
      command: ["sh", "-c", "echo storage-ready > /data/status.txt; sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: app-data
